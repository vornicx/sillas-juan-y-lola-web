name: Install catalog HQ payload

on:
  push:
    branches:
      - catalog-hq-960-final

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[hq-installed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .catalog-hq-upgrade/payload-* | base64 --decode > /tmp/catalog-hq.zip
          echo "413efea0b795d3a562a655516b35e145eadbc545b11e5bf133e94c90a427f135  /tmp/catalog-hq.zip" | sha256sum -c -
          unzip -o /tmp/catalog-hq.zip -d .
          rm -rf .catalog-hq-upgrade
          rm -f .github/workflows/catalog-hq-install.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: install p73-p81 960px catalog images [hq-installed]"
          git push origin HEAD
