name: Canva image URL test
on:
  push:
    branches: [catalog-images-final]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Canva public view payload
        shell: bash
        run: |
          set -u
          VIEW='https://www.canva.com/d/RGQrwbfybycmSH7'
          code=$(curl -L -sS -w '%{http_code}' -o view.html "$VIEW" || true)
          echo "VIEW HTTP $code"
          wc -c view.html
          grep -o 'ifs[^"<> ]*' view.html | head -20 || true
          grep -o '6d8c1bb6[^"<> ]*' view.html | head -20 || true
          grep -o 'media.canva.com[^"<> ]*' view.html | head -20 || true
          grep -o 'document-export[^"<> ]*' view.html | head -20 || true
