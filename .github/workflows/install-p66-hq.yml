name: Install p67 HQ

on:
  push:
    branches:
      - catalog-hq-payload

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-hq-payload
      - name: Reconstruct and verify p67
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/catalog-hq assets/images/catalogo-2025
          base64 -d payload-p67.b64 > /tmp/catalog-hq/p67.avif
          actual="$(git hash-object /tmp/catalog-hq/p67.avif)"
          expected="2b1ad1fac974b7eee8b41e346eecc27dfe50a2bd"
          test "$actual" = "$expected"
          cp /tmp/catalog-hq/p67.avif assets/images/catalogo-2025/vichy-negro-crossback-nogal.avif
      - name: Commit verified p67
        shell: bash
        run: |
          set -euo pipefail
          git add assets/images/catalogo-2025/vichy-negro-crossback-nogal.avif
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: install verified p67 HQ"
          git push origin HEAD:catalog-hq-payload
