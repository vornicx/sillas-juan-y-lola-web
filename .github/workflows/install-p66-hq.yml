name: Install p66-p71 HQ

on:
  push:
    branches:
      - catalog-hq-payload

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-hq-payload
      - name: Reconstruct and verify HQ catalog images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/catalog-hq assets/images/catalogo-2025

          base64 -d payload-p66.b64 > /tmp/catalog-hq/p66.avif
          base64 -d payload-p67.b64 > /tmp/catalog-hq/p67.avif
          base64 -d payload-p68-71.zip.b64 > /tmp/catalog-hq/p68-71.zip

          echo "f480815e4bd6dff7f718070d34d115a6effb9dd5f95e190430c884a7c5353772  /tmp/catalog-hq/p68-71.zip" | sha256sum -c -
          unzip -q /tmp/catalog-hq/p68-71.zip -d /tmp/catalog-hq

          verify() {
            file="$1"
            expected="$2"
            actual="$(git hash-object "$file")"
            test "$actual" = "$expected"
          }

          verify /tmp/catalog-hq/p66.avif 5a7f0fdfa25cac2cefb906412f14432b6d9cb49b
          verify /tmp/catalog-hq/p67.avif 2b1ad1fac974b7eee8b41e346eecc27dfe50a2bd
          verify /tmp/catalog-hq/p68.avif 81b202af9554d601ff4f7d4228b24b13ec801177
          verify /tmp/catalog-hq/p69.avif 52e05086a8846a053c1762b85477504d31ced7ba
          verify /tmp/catalog-hq/p70.avif 4c77c12de8878ee334d74c40c751dfd080bd4f07
          verify /tmp/catalog-hq/p71.avif 8b77abe04241b28ef4bdbc6f4b18053265393ef5

          cp /tmp/catalog-hq/p66.avif assets/images/catalogo-2025/vichy-negro-crossback-blanca.avif
          cp /tmp/catalog-hq/p67.avif assets/images/catalogo-2025/vichy-negro-crossback-nogal.avif
          cp /tmp/catalog-hq/p68.avif assets/images/catalogo-2025/vichy-negro-forja-cruzada.avif
          cp /tmp/catalog-hq/p69.avif assets/images/catalogo-2025/vichy-verde-crossback-nogal.avif
          cp /tmp/catalog-hq/p70.avif assets/images/catalogo-2025/vichy-verde-orbelina.avif
          cp /tmp/catalog-hq/p71.avif assets/images/catalogo-2025/vichy-verde-tiffany-blanca.avif
      - name: Commit verified images
        shell: bash
        run: |
          set -euo pipefail
          git add assets/images/catalogo-2025/vichy-negro-crossback-blanca.avif \
                  assets/images/catalogo-2025/vichy-negro-crossback-nogal.avif \
                  assets/images/catalogo-2025/vichy-negro-forja-cruzada.avif \
                  assets/images/catalogo-2025/vichy-verde-crossback-nogal.avif \
                  assets/images/catalogo-2025/vichy-verde-orbelina.avif \
                  assets/images/catalogo-2025/vichy-verde-tiffany-blanca.avif
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: install verified p66-p71 HQ"
          git push origin HEAD:catalog-hq-payload
