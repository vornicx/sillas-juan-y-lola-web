name: Install verified catalog bundle

on:
  push:
    branches: [catalog-images-final]
    paths:
      - '.github/catalog-bundle/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-images-final
          fetch-depth: 0

      - name: Reconstruct and verify catalog bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/catalog-bundle/catalog-q34.zip.b64.part* > /tmp/catalog.b64
          base64 -d /tmp/catalog.b64 > /tmp/catalog.zip
          echo '379bbea46cc70760c3b7cdd0967185a668953bcf24a66a19acc55b5c55112fcd  /tmp/catalog.zip' | sha256sum -c -
          rm -rf /tmp/catalog
          mkdir -p /tmp/catalog
          unzip -q /tmp/catalog.zip -d /tmp/catalog
          (cd /tmp/catalog && sha256sum -c SHA256SUMS)
          python - <<'PY'
          from pathlib import Path
          root = Path('/tmp/catalog')
          files = sorted(root.glob('*.avif'))
          if len(files) != 81:
              raise SystemExit(f'Expected 81 AVIF files, found {len(files)}')
          for path in files:
              data = path.read_bytes()
              if len(data) < 10000:
                  raise SystemExit(f'Unexpectedly small AVIF: {path.name} ({len(data)} bytes)')
              if data[4:12] != b'ftypavif':
                  raise SystemExit(f'Not a real AVIF: {path.name}')
          print(f'Verified {len(files)} AVIF files')
          PY
          mkdir -p assets/images/catalogo-2025
          find assets/images/catalogo-2025 -maxdepth 1 -type f -name '*.avif' -delete
          cp /tmp/catalog/*.avif assets/images/catalogo-2025/

      - name: Commit verified image set and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .github/catalog-bundle .github/image-payload
          rm -f .github/workflows/image-payload-reconstruct.yml
          git add -A
          git commit -m 'fix: install verified sharp catalog image set'
          git push origin HEAD:catalog-images-final
